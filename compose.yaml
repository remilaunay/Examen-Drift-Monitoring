services:
  monitor-script:
    image: bike-sharing-monitoring:local
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app

  monitor-ui:
    image: bike-sharing-monitoring:local
    depends_on:
      monitor-script:
        condition: service_completed_successfully
    volumes:
      - ./bike_sharing_monitoring:/app/bike_sharing_monitoring
    ports:
      - "8000:8000"
    command:
      - evidently
      - ui
      - --workspace
      - /app/bike_sharing_monitoring
      - --host
      - 0.0.0.0
      - --port
      - "8000"
